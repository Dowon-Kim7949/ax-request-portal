# Live demo on GitHub Pages, running against the in-browser mock API.
# Settings → Pages → Source must be "GitHub Actions".
name: Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project pages live under /<repository>/. Use "/" for a user site or a custom domain.
          VITE_BASE: /${{ github.event.repository.name }}/
          # The demo runs on the in-browser mock: every screen shows a "demo mode" banner.
          VITE_API_MOCK: 'true'
      # GitHub Pages has no SPA fallback: serve the app for unknown paths so deep links work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
