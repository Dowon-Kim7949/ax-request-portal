name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor of each supported line in package.json "engines" (React Router 8 and jsdom 30 set them).
        node: ['22.22.2', '24.15.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    name: E2E (phone, tablet, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  nginx:
    name: nginx config serves the build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start nginx with deploy/nginx.conf
        run: |
          docker run -d --name web -p 8080:80 \
            -v "$PWD/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine
          docker exec web nginx -t
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 0.5; done
      - name: Check SPA fallback and cache headers
        run: bash deploy/check-nginx.sh http://localhost:8080
      - if: failure()
        run: docker logs web
