version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions arrive as their own (ungrouped) PRs so CI judges each one and a
    # person decides; they are never merged automatically. Check a major's "engines"
    # before merging: raising the Node floor is a breaking change for template users.
    # @types/node follows the Node runtime (22), not the newest Node.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
