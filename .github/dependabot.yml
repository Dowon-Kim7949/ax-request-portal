version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions change APIs (React Router 8 broke the e2e suite), so they are
    # upgraded deliberately, not by bot. @types/node follows the Node runtime (22).
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
