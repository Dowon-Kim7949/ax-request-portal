<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f8" />
    <meta name="description" content="AI-assisted work request portal template" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>AX 업무 요청</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown until React mounts, so a slow start is never a blank page -->
      <div style="min-height: 100dvh; display: grid; place-items: center">
        <span
          style="
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid #e4e7ec;
            border-top-color: #1d64db;
            animation: boot-spin 0.8s linear infinite;
          "
        ></span>
      </div>
      <style>
        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
