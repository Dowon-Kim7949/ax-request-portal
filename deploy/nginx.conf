# AX Request Portal: serve the built app (dist/) with nginx.
#
#   npm run build
#   cp -r dist/* /usr/share/nginx/html/
#   cp deploy/nginx.conf /etc/nginx/conf.d/ax-request-portal.conf   # adjust server_name / root
#   nginx -t && nginx -s reload
#
# CI starts nginx:stable-alpine with this exact file and checks it with
# deploy/check-nginx.sh, so the behaviour below is tested, not just documented.

server {
    listen 80;
    server_name _;                      # e.g. ax.example.internal

    root /usr/share/nginx/html;         # contents of dist/
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Note: a location that sets add_header drops the server-level ones,
    # so every location repeats the security headers.

    # Fingerprinted build output: safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Mock-mode service worker: must be revalidated so a new build takes over.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Same-origin backend (build with VITE_API_MOCK=false VITE_API_BASE_URL=/api).
    # The backend implements docs/openapi.json.
    #
    # location /api/ {
    #     proxy_pass http://ax-backend:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 12m;          # attachments are capped at 10 MB
    # }

    # Everything else is the single-page app: unknown paths load index.html
    # and the client-side router takes over. index.html itself is never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

