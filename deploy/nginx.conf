# AX Request Portal: serve the built app (dist/) with nginx.
#
#   npm run build
#   cp -r dist/* /usr/share/nginx/html/
#   cp deploy/nginx.conf /etc/nginx/conf.d/ax-request-portal.conf   # adjust server_name / root
#   nginx -t && nginx -s reload
#
# CI starts nginx:stable-alpine with this exact file and checks it with
# deploy/check-nginx.sh (once for a mock build, once for a real-backend build),
# so the behaviour below is tested, not just documented.
#
# This file goes inside nginx's http block (conf.d/), which is why it can
# declare the two maps below. Their names are prefixed to stay unique there.

# Cache policy by path. Fingerprinted build output (assets/) is cached for a
# year; everything else is revalidated on every load: index.html, version.json
# (which open tabs poll to learn of a new deployment), the service worker.
map $uri $ax_cache_control {
    ~/assets/   "public, max-age=31536000, immutable";
    default     "no-cache";
}

# Content-Security-Policy of the app.
#
# - script-src: the build's own files plus the one inline script in index.html
#   (it applies the saved theme before the first paint), allowed by its hash.
#   Edit that script and the hash changes: print the new one with
#   `node deploy/csp-hashes.mjs index.html`. src/config/deploy-config.test.ts
#   and deploy/check-nginx.sh fail while they differ.
# - style-src / font-src: the Pretendard web font from cdn.jsdelivr.net
#   (linked in index.html). 'unsafe-inline' styles: React style attributes,
#   the toaster and the boot spinner.
# - connect-src: API calls. 'self' covers the mock and a same-origin /api.
#   A backend on another origin must be added here, e.g.
#   connect-src 'self' https://api.your-company.com;
# - img-src data: and blob: are attachment and preview images.
#
# The mock service worker gets no policy: it fetches the web font on the
# page's behalf, and a worker obeys the policy of its own script, where
# connect-src 'self' would block that. The page's policy has already allowed
# the request by then.
map $uri $ax_csp {
    ~/mockServiceWorker\.js$  "";
    default "default-src 'self'; script-src 'self' 'sha256-Pjx8EP331ZG7aoGl4ASOeQ6sSNt/QlOx6Gdsq3Hlx6U='; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name _;                      # e.g. ax.example.internal

    root /usr/share/nginx/html;         # contents of dist/
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Response headers, set once for every location below. A location that
    # has its own add_header loses all of these, so none of them does.
    #
    # Cache-Control has no "always": an error such as a missing asset's 404
    # must not be cached for a year.
    add_header Cache-Control $ax_cache_control;
    add_header Content-Security-Policy $ax_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # HSTS belongs where TLS terminates: here if nginx serves https itself,
    # otherwise at the load balancer in front of it. Browsers then refuse
    # plain http for max-age seconds, so start small and raise it once https
    # works for every host it covers.
    #
    # add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # Fingerprinted build output. A missing file is a 404, not index.html,
    # or a stale tab would get HTML as JavaScript.
    location /assets/ {
        try_files $uri =404;
    }

    # Mock-mode service worker. A real-backend build has none: answer 404, not
    # the app's HTML.
    location = /mockServiceWorker.js {
        try_files $uri =404;
    }

    # Same-origin backend (build with VITE_API_MOCK=false VITE_API_BASE_URL=/api).
    # The backend implements docs/openapi.json.
    #
    # location /api/ {
    #     proxy_pass http://ax-backend:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 12m;          # attachments are capped at 10 MB
    # }

    # Everything else is the single-page app: unknown paths load index.html
    # and the client-side router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Serving under a sub-path instead, e.g. https://host/ax/: build with
# VITE_BASE=/ax/, copy dist/ to /var/www/ax/, and replace the /assets/,
# /mockServiceWorker.js and / locations above with these. The maps match
# /ax/assets/ and /ax/mockServiceWorker.js too, so caching and headers stay
# the same. CI does not run this variant; check a deployment of it with
# `bash deploy/check-nginx.sh https://host/ax`.
#
#     location /ax/assets/ {
#         root /var/www;
#         try_files $uri =404;
#     }
#     location = /ax/mockServiceWorker.js {
#         root /var/www;
#         try_files $uri =404;
#     }
#     location /ax/ {
#         root /var/www;
#         try_files $uri $uri/ /ax/index.html;
#     }
#
# The mock API needs nothing here (it answers inside the browser). A real
# backend proxied under the sub-path needs VITE_API_BASE_URL=/ax/api.
